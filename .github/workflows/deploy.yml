name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'   # daily, so the GitHub stats snapshot stays fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Snapshot GitHub stats (fallback if live requests are blocked)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: Abhi23raj472
        run: |
          mkdir -p public/github-data
          save() {  # save URL to FILE only if the download succeeds
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$1" -o "$2.tmp"; then mv "$2.tmp" "$2"; else rm -f "$2.tmp"; fi
          }
          save "https://api.github.com/users/$GH_USER" public/github-data/user.json
          save "https://api.github.com/users/$GH_USER/repos?per_page=100&sort=pushed" public/github-data/repos.json
          if curl -fsSL "https://github-contributions-api.jogruber.de/v4/$GH_USER?y=all" -o c.tmp; then mv c.tmp public/github-data/contributions.json; fi
          ls -la public/github-data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is "Deploy from a branch", GitHub also
      # publishes the raw, unbuilt repository on every push to main. Whichever
      # deploy finishes last wins, and the raw one shows a blank page. Wait for
      # that branch build to finish so this built site is published after it.
      - name: Wait for branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            status=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status 2>/dev/null || echo none)
            echo "branch build: $status"
            case "$status" in
              building|queued) sleep 10 ;;
              *) break ;;
            esac
          done
          # "built" is reported a few seconds before that build's own deploy ends.
          sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
